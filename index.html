const u=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open(pw){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:u(D.s),iterations:D.n,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const p=await crypto.subtle.decrypt({name:'AES-GCM',iv:u(D.i)},k,u(D.c));
  return new TextDecoder().decode(p);
}
function show(html){document.open();document.write(html);document.close()}
const f=document.getElementById('f'),pw=document.getElementById('pw'),go=document.getElementById('go'),err=document.getElementById('err');
f.addEventListener('submit',async e=>{e.preventDefault();go.disabled=true;go.textContent='Opening…';err.textContent='';
  try{const h=await open(pw.value);try{sessionStorage.setItem('ewpw',pw.value)}catch(_){}show(h)}
  catch(_){err.textContent='That password is not right. Try again.';go.disabled=false;go.textContent='Open';pw.select()}});
(async()=>{let s=null;try{s=sessionStorage.getItem('ewpw')}catch(_){}if(s){try{show(await open(s))}catch(_){}}})();
</script></body></html>
